<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RN Showcase">
  <!-- iOS app icon: full-bleed, opaque, square corners — the system applies the mask. Same glyph as
       the Android foreground, scaled 108 -> 1024. -->
  <rect width="1024" height="1024" fill="#0E2A47"/>
  <g transform="scale(9.481481)">
    <g fill="none" stroke="#61DAFB" stroke-width="4.5">
      <ellipse cx="54" cy="54" rx="28" ry="11"/>
      <ellipse cx="54" cy="54" rx="28" ry="11" transform="rotate(60 54 54)"/>
      <ellipse cx="54" cy="54" rx="28" ry="11" transform="rotate(120 54 54)"/>
    </g>
    <circle cx="54" cy="54" r="6" fill="#61DAFB"/>
  </g>
</svg>
