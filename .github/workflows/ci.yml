name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format check
        run: npm run format:check

      # Only the spec is checked out of kmp-showcase, so nothing of the server reaches a later step.
      - name: Check out the API spec
        uses: actions/checkout@v4
        with:
          repository: mkdigitalsk/kmp-showcase
          path: .kmp-showcase
          sparse-checkout: contracts/openapi.json
          sparse-checkout-cone-mode: false

      - name: Types check
        env:
          API_SPEC: .kmp-showcase/contracts/openapi.json
        run: npm run types:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:ci

      - name: TypeScript type check
        run: npm run typecheck
